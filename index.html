<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <h1>✊ Rock ✋ Paper ✌️ Scissors</h1>

  <div class="stats">
    <p>W: <span id="wins">0</span> 
       D: <span id="draws">0</span> 
       L: <span id="losses">0</span></p>
    <p>Win%: <span id="winPercent">N/A</span></p>
  </div>

  <div id="countdown">Play!</div>

  <div class="images">
    <img id="playerImg" alt="Player choice"/>
    <img id="computerImg" alt="Computer choice"/>
  </div>

  <div class="choices">
    <button onclick="startGame('rock')">✊ Rock</button>
    <button onclick="startGame('paper')">✋ Paper</button>
    <button onclick="startGame('scissors')">✌️ Scissors</button>
  </div>

 
  <h2 id="result"></h2>
</div>

<script src="game.js"></script>
</body>
</html>
